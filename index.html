<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script src="plane.js"></script>
  <script src="streets.js"></script>
  <script src="surface.js"></script>
  <script src="buildings.js"></script>
  <script src="rayTracing.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const gl = canvas.getContext("webgl2");

    function loadTexture(gl, url, unit, onLoad) {
      const tex = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([180, 180, 180, 255]));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      const img = new Image();
      img.onload = () => {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        if (onLoad) onLoad();
      };

      img.onerror = () => console.error('Failed to load texture:', url);
      img.src = url;
      return tex;
    }

    const vsSource = `#version 300 es
    in vec2 aPosition;
    out vec2 vPos;
    void main() {
      vPos = aPosition;
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }`;

    const fsSource = rayTracer + `
    in vec2 vPos;
    uniform float uAspect;
    uniform vec2 uCameraOrbit;
    uniform float uCameraDistance;
    out vec4 fragColor;

    void main() {
        float cp = cos(uCameraOrbit.x);
        float sp = sin(uCameraOrbit.x);
        float cy = cos(uCameraOrbit.y);
        float sy = sin(uCameraOrbit.y);
        mat3 rotX = mat3(1.0, 0.0, 0.0, 0.0, cp, -sp, 0.0, sp, cp);
        mat3 rotY = mat3(cy, 0.0, -sy, 0.0, 1.0, 0.0, sy, 0.0, cy);
        mat3 camera = rotY * rotX;

        float f = 2.4142;
        vec3 target = vec3(0.0, 0.35, 0.0);
        vec3 origin = target + camera * vec3(0.0, 0.0, uCameraDistance);
        vec3 dir = camera * normalize(vec3(vPos.x * uAspect, vPos.y, -f));
        fragColor = vec4(trace(Ray(origin, dir)), 1.0);
    }`;    

    const prog = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vsSource], [gl.FRAGMENT_SHADER, fsSource]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);

      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
      }

      gl.attachShader(prog, s);
    }

    gl.linkProgram(prog);
    gl.useProgram(prog);
    BUILDING.upload(gl, prog, createBuildingPreview());
    loadTexture(gl, 'planeMetal/planeMetal_Color.png', 0, render);
    loadTexture(gl, 'planeMetal/planeMetal_Displacement.png', 1, render);
    gl.uniform1i(gl.getUniformLocation(prog, 'planeTex'), 0);
    gl.uniform1i(gl.getUniformLocation(prog, 'planeBump'), 1);

    const streets = createStreetPreview();
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8UI, streets.width, streets.height, 0,
                  gl.RED_INTEGER, gl.UNSIGNED_BYTE, streets.pixels);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.uniform1i(gl.getUniformLocation(prog, 'streetLayout'), 2);
    gl.uniform2fv(gl.getUniformLocation(prog, 'streetOrigin'), streets.origin);

    const positions = new Float32Array([-1,-1,  1,-1,  -1,1,  1,1]);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "aPosition");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const planePosLoc = gl.getUniformLocation(prog, "planePos");
    const planeRotLoc = gl.getUniformLocation(prog, "planeRot");
    const aspectLoc = gl.getUniformLocation(prog, "uAspect");
    const orbitLoc = gl.getUniformLocation(prog, "uCameraOrbit");
    const distanceLoc = gl.getUniformLocation(prog, "uCameraDistance");
    let pitch = 0.65, yaw = -0.45, distance = 21;

    function render() {
      gl.uniform1f(aspectLoc, canvas.width / canvas.height);
      gl.uniform2f(orbitLoc, pitch, yaw);
      gl.uniform1f(distanceLoc, distance);
      gl.uniform3f(planePosLoc, 0, 0, 0);
      gl.uniformMatrix3fv(planeRotLoc, false, [1, 0, 0, 0, 1, 0, 0, 0, 1]);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    canvas.addEventListener("pointerdown", e => canvas.setPointerCapture(e.pointerId));
    canvas.addEventListener("pointermove", e => {
      if (!canvas.hasPointerCapture(e.pointerId)) {
        return;
      }

      yaw -= e.movementX * 0.01;
      pitch = Math.min(1.55, Math.max(0.06, pitch + e.movementY * 0.01));
      render();
    });
    canvas.addEventListener("wheel", e => {
      const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? canvas.height : 1;
      distance = Math.min(32, Math.max(4, distance * Math.exp(e.deltaY * scale * 0.001)));
      render();
    });

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);
      render();
    }

    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
